<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<link rel="stylesheet" href="design-system/tokens.css">
<link rel="stylesheet" href="design-system/components/bundle.css">
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="design-system/components/bundle.js"></script>
<title>Deal Tracker — landing page reference</title>
<style>
  body { margin: 0; background: var(--surface); }
  .lp { width: 1280px; font-family: var(--font-sans); color: var(--ink); }
  .wrap { width: 1120px; margin: 0 auto; }

  /* nav */
  .nav { display: flex; align-items: center; justify-content: space-between; height: 80px; }
  .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 18px; text-decoration: none; color: var(--ink); }
  .brand-tile { width: 32px; height: 32px; border-radius: var(--radius-sm); background: var(--gradient-horizon); }
  .nav-links { display: flex; align-items: center; gap: var(--space-lg); }
  .nav-links a { font-size: 15px; font-weight: 600; color: var(--ink-muted); text-decoration: none; }
  .nav-links a:hover { color: var(--ink); }
  .nav-actions { display: flex; gap: var(--space-xs); }

  /* hero */
  .hero { background: var(--gradient-wash); padding-bottom: var(--space-xl); }
  .hero-grid { display: grid; grid-template-columns: 1fr 420px; gap: var(--space-xl); align-items: center; padding-top: var(--space-xl); }
  .overline { display: inline-block; font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--blue-600); margin-bottom: var(--space-sm); }
  .hero h1 { margin: 0; font-size: 56px; line-height: 62px; font-weight: 700; letter-spacing: -0.025em; }
  .hero h1 em { font-style: normal; color: var(--orange-700); }
  .lede { margin: var(--space-md) 0 0; max-width: 520px; font-size: 18px; line-height: 30px; color: var(--ink-muted); }
  .points { list-style: none; margin: var(--space-lg) 0 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .points li { display: flex; align-items: center; gap: 12px; font-size: 16px; line-height: 24px; }
  .points li::before { content: ""; flex: none; width: 10px; height: 10px; border-radius: var(--radius-pill); background: var(--blue-600); box-shadow: 0 0 0 4px var(--blue-100); }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-md); margin-top: var(--space-xl); }
  .stats-note { margin: var(--space-sm) 0 0; font-size: 13px; color: var(--ink-muted); text-align: right; }

  /* demo */
  .section { padding: var(--space-xl) 0; }
  .section-head { text-align: center; max-width: 760px; margin: 0 auto var(--space-lg); }
  .section-head h2 { margin: 0; font-size: 36px; line-height: 44px; font-weight: 700; letter-spacing: -0.015em; }
  .section-head p { margin: var(--space-sm) 0 0; font-size: 18px; line-height: 30px; color: var(--ink-muted); }

  .stage { position: relative; padding: var(--space-lg); }
  .glow { position: absolute; inset: 0 40px; border-radius: 32px; background: var(--gradient-horizon); opacity: .9; }
  .frame { position: relative; border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--shadow-lift); overflow: hidden; }
  .bar { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 var(--space-sm); background: var(--surface-raised); border-bottom: 1px solid var(--line); }
  .bar i { width: 10px; height: 10px; border-radius: var(--radius-pill); background: var(--line); }
  .addr { margin-left: var(--space-sm); flex: 1; max-width: 420px; height: 26px; border-radius: var(--radius-pill); background: var(--surface); display: flex; align-items: center; padding: 0 12px; font-size: 12px; color: var(--ink-muted); }
  .app { display: grid; grid-template-columns: 1fr 340px; gap: var(--space-md); padding: var(--space-md); }
  .app-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-md); }
  .app-head h3 { margin: 0; font-size: 24px; line-height: 32px; font-weight: 700; }
  .app-head p { margin: 2px 0 0; font-size: 14px; color: var(--ink-muted); }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-md); align-items: start; }
  .panel { padding: var(--space-sm); border-radius: var(--radius-lg); background: var(--surface-raised); box-shadow: var(--shadow-soft); align-self: start; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; padding: var(--space-xs) var(--space-xs) var(--space-sm); }
  .panel-head h4 { margin: 0; font-size: 17px; font-weight: 600; }
  .day { margin: var(--space-sm) var(--space-xs) var(--space-xs); font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); }
  .rows { display: flex; flex-direction: column; gap: var(--space-xs); }
  .rows .dt-notif { padding: 12px; gap: 12px; }
  .rows .dt-notif__msg { font-size: 15px; line-height: 22px; }
  .rows .dt-notif__meta .dt-badge { display: none; }

  /* how it works */
  .how { display: grid; grid-template-columns: 1fr 520px; gap: var(--space-xl); align-items: center; }
  .steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--space-lg); }
  .steps li { display: grid; grid-template-columns: 48px 1fr; gap: var(--space-md); }
  .num { width: 48px; height: 48px; border-radius: var(--radius-pill); display: grid; place-items: center; font-weight: 700; font-size: 18px; background: var(--blue-100); color: var(--blue-600); }
  .steps li:last-child .num { background: var(--orange-100); color: var(--orange-700); }
  .steps h3 { margin: 0; font-size: 20px; line-height: 28px; font-weight: 600; }
  .steps p { margin: 4px 0 0; font-size: 16px; line-height: 26px; color: var(--ink-muted); }

  /* closing */
  .cta { display: flex; align-items: center; justify-content: space-between; gap: var(--space-lg); padding: var(--space-lg) var(--space-xl); border-radius: var(--radius-lg); background: var(--ink); }
  .cta h2 { margin: 0; font-size: 30px; line-height: 38px; font-weight: 700; color: var(--surface-raised); }
  .cta p { margin: 6px 0 0; font-size: 16px; color: var(--line); }
  .foot { display: flex; justify-content: space-between; align-items: center; padding: var(--space-lg) 0; margin-top: var(--space-lg); border-top: 1px solid var(--line); font-size: 14px; color: var(--ink-muted); }
  .foot nav { display: flex; gap: var(--space-md); }
  .foot a { color: var(--ink-muted); text-decoration: none; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var D = window.DealTracker, h = React.createElement, noop = function () {};

  function Nav() {
    return h('header', { className: 'wrap nav' },
      h('a', { className: 'brand', href: '#' }, h('span', { className: 'brand-tile', 'aria-hidden': 'true' }), 'Deal Tracker'),
      h('nav', { className: 'nav-links' },
        h('a', { href: '#how' }, 'How it works'),
        h('a', { href: '#demo' }, 'See it live'),
        h('div', { className: 'nav-actions' },
          h(D.Button, { variant: 'quiet' }, 'Log in'),
          h(D.Button, { variant: 'secondary' }, 'Create account'))));
  }

  function Hero() {
    return h('section', { className: 'hero' },
      h(Nav),
      h('div', { className: 'wrap' },
        h('div', { className: 'hero-grid' },
          h('div', null,
            h('span', { className: 'overline' }, 'Campaign and offer alerts'),
            h('h1', null, 'Know the moment your favourite stores ', h('em', null, 'go on sale.')),
            h('p', { className: 'lede' }, 'Pick any website or online store, tell us what counts as a deal, and we’ll let you know when a campaign or offer goes live. No more checking.'),
            h('ul', { className: 'points' },
              h('li', null, 'Works with any store, no plugin or app needed'),
              h('li', null, 'Alerts by email or push, only when something changes'),
              h('li', null, 'Free for up to 5 trackers'))),
          h(D.AuthCard, { defaultMode: 'register' })),
        h('div', { className: 'stats' },
          h(D.StatTile, { value: '12,480', label: 'Sites tracked', detail: 'Stores and campaign pages' }),
          h(D.StatTile, { value: '3,914', label: 'Offers found', detail: 'In the last 30 days', tone: 'deal' }),
          h(D.StatTile, { value: '15 min', label: 'Between checks', detail: 'On every tracked page' }),
          h(D.StatTile, { value: '18%', label: 'Average discount', detail: 'Across offers found', tone: 'deal' }))));
  }

  function Demo() {
    return h('section', { className: 'section', id: 'demo' },
      h('div', { className: 'wrap' },
        h('div', { className: 'section-head' },
          h('h2', null, 'Your stores, watched while you’re away'),
          h('p', null, 'Every tracker shows what it’s waiting for and when it last looked. When an offer goes live, it turns orange and lands in your alerts.')),
        h('div', { className: 'stage' },
          h('div', { className: 'glow', 'aria-hidden': 'true' }),
          h('div', { className: 'frame', role: 'img', 'aria-label': 'Preview of the Deal Tracker dashboard' },
            h('div', { className: 'bar' }, h('i'), h('i'), h('i'), h('span', { className: 'addr' }, 'Your trackers')),
            h('div', { className: 'app' },
              h('div', null,
                h('div', { className: 'app-head' },
                  h('div', null, h('h3', null, 'Your trackers'), h('p', null, '4 active · 1 offer live')),
                  h(D.Button, { variant: 'primary', size: 'sm' }, 'Track a new site')),
                h('div', { className: 'cards' },
                  h(D.TrackerCard, { store: 'Nordic Outdoor Store', url: 'nordicoutdoor.se/jackets', status: 'deal', deal: { title: '20% off all jackets', detail: '€149 → €119 · ends Sunday' }, lastChecked: 'Found 12 min ago', onViewOffer: noop }),
                  h(D.TrackerCard, { store: 'Lindqvist Home', url: 'lindqvisthome.se', status: 'watching', watchFor: 'Any sitewide campaign', lastChecked: 'Checked 4 min ago', onTogglePause: noop }),
                  h(D.TrackerCard, { store: 'Sportkompaniet', url: 'sportkompaniet.se/lopskor', status: 'watching', watchFor: 'Price drop under €90', lastChecked: 'Checked 9 min ago', onTogglePause: noop }),
                  h(D.TrackerCard, { store: 'Bokhandeln', url: 'bokhandeln.se/kampanj', status: 'paused', watchFor: 'Keyword “3 för 2”', lastChecked: 'Paused since 2 Oct', onTogglePause: noop }))),
              h('aside', { className: 'panel' },
                h('div', { className: 'panel-head' }, h('h4', null, 'Alerts'), h(D.DealBadge, { tone: 'deal' }, '2 new')),
                h('p', { className: 'day' }, 'Today'),
                h('div', { className: 'rows' },
                  h(D.NotificationRow, { store: 'Nordic Outdoor Store', message: '20% off all jackets, ends Sunday', time: '12 min', unread: true }),
                  h(D.NotificationRow, { store: 'Lindqvist Home', message: 'Free shipping over €50', time: '1 h', unread: true })),
                h('p', { className: 'day' }, 'Earlier'),
                h('div', { className: 'rows' },
                  h(D.NotificationRow, { store: 'Bokhandeln', message: '3 for 2 on paperbacks ended', time: 'Mon' }),
                  h(D.NotificationRow, { store: 'Sportkompaniet', message: 'Running shoes −25%', time: 'Sat' }))))))));
  }

  function How() {
    return h('section', { className: 'section', id: 'how' },
      h('div', { className: 'wrap how' },
        h('div', null,
          h('div', { className: 'section-head', style: { textAlign: 'left', margin: '0 0 40px' } },
            h('h2', null, 'Set it up in a minute'),
            h('p', null, 'Add a page, choose what counts, and get on with your day.')),
          h('ol', { className: 'steps' },
            h('li', null, h('span', { className: 'num' }, '1'), h('div', null, h('h3', null, 'Add a site'), h('p', null, 'Paste a store’s front page, a category or a single product.'))),
            h('li', null, h('span', { className: 'num' }, '2'), h('div', null, h('h3', null, 'Choose what counts'), h('p', null, 'Any campaign, a price drop, free shipping or a keyword like “Black Friday”.'))),
            h('li', null, h('span', { className: 'num' }, '3'), h('div', null, h('h3', null, 'Get the alert'), h('p', null, 'We check as often as every 15 minutes and tell you once, when it goes live.'))))),
        h(D.AddTrackerForm, { defaultValues: { url: 'nordicoutdoor.se/jackets', watch: 'price', push: true } })));
  }

  function Closing() {
    return h('section', { className: 'wrap', style: { paddingBottom: '0' } },
      h('div', { className: 'cta' },
        h('div', null, h('h2', null, 'Stop checking. Start knowing.'), h('p', null, 'Create a free account and add your first store.')),
        h(D.Button, { variant: 'primary' }, 'Create free account')),
      h('footer', { className: 'foot' },
        h('span', null, '© 2026 Deal Tracker'),
        h('nav', null, h('a', { href: '#' }, 'Privacy'), h('a', { href: '#' }, 'Terms'), h('a', { href: '#' }, 'Contact'))));
  }

  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'lp' }, h(Hero), h(Demo), h(How), h(Closing)));
</script>
</body>
</html>
