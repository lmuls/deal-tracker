# Campaign signals, matched only inside prominent page regions (title, header,
# hero/banner/announcement bars, h1/h2) by CampaignDetector.
# Keywords are matched case-insensitively on whole-word boundaries.
# Pattern order matters: the first pattern yielding the highest percentage
# provides the campaign title, so put the most descriptive patterns first.
locales:
  en:
    sale_event:
      keywords:
        - "black friday"
        - "black week"
        - "cyber monday"
        - "cyber week"
        - "singles day"
        - "boxing day"
        - "prime day"
        - "spring sale"
        - "summer sale"
        - "winter sale"
        - "autumn sale"
        - "holiday sale"
        - "christmas sale"
        - "january sale"
        - "mid-season sale"
        - "end of season sale"
        - "flash sale"
        - "clearance sale"
        - "site-wide sale"
        - "sitewide sale"
        - "store-wide sale"
        - "storewide sale"
        - "anniversary sale"
        - "warehouse sale"
        - "everything must go"
    percentage_discount:
      patterns:
        - 'up\s+to\s+\d{1,2}\s?%(\s*off)?'
        - 'save\s+(up\s+to\s+)?\d{1,2}\s?%'
        - '(?<!\d)\d{1,2}\s?%\s*(off|discount|savings)'
      keywords:
        - "half price"
        - "half off"

  no:
    sale_event:
      keywords:
        - "black friday"
        - "black week"
        - "cyber monday"
        - "singles day"
        - "vårsalg"
        - "sommersalg"
        - "vintersalg"
        - "høstsalg"
        - "julesalg"
        - "romjulssalg"
        - "januarsalg"
        - "mellomsalg"
        - "sesongslutt"
        - "lageruttømming"
        - "lagersalg"
        - "storsalg"
        - "supersalg"
        - "alt må ut"
    percentage_discount:
      patterns:
        - 'opptil\s+\d{1,2}\s?%(\s*(rabatt|avslag))?'
        - 'spar\s+(opptil\s+)?\d{1,2}\s?%'
        - '(?<!\d)\d{1,2}\s?%\s*(rabatt|avslag)'
      keywords:
        - "halv pris"
